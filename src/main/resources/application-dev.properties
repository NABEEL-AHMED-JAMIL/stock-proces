#================================
# ==== EFS-Local-File ===========
# ===============================
storage.efsFileDire=G://efs
# Base log file name
logging.file.name=./logs/stock-process.log
# devtools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# ===============================
# = Ollama =====================
# ===============================
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

# ===============================
# = DATA SOURCE =================
# ===============================
# Set here configurations for the database connection
spring.jackson.serialization.fail-on-empty-beans=false
spring.datasource.url=jdbc:postgresql://localhost:5433/vectordb
spring.datasource.username=postgres
spring.datasource.password=postgres
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

# ===============================
# = JPA / HIBERNATE =============
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=false
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
# Use the Hibernate logger to show the actual SQL query with parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.defer-datasource-initialization=true

# ===============================
# = Shareable TaskExecutor Configuration
# ===============================
# Minimum number of threads in the pool (start with fewer threads)
async.task.executor.corePoolSize=1
# Maximum number of threads (ensuring only 20 tasks run concurrently)
async.task.executor.maximumPoolSize=20
# Keep threads alive for 60 seconds (1 minute)
async.task.executor.keepAliveTime=600000

# ===============================
# = Liquibase  ==================
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml